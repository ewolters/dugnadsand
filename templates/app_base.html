{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dugnadsand{% endblock %}</title>
  <!-- Must come first: every local alias below resolves to a --brand-* token
       defined here. Without it they are undefined, which invalidates the whole
       declaration and the page renders unstyled. -->
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
  <style>
    :root {
      --birch:var(--brand-background); --paper:var(--brand-surface); --ink:var(--brand-text-dark); --spruce:var(--brand-primary);
      --ochre:var(--brand-secondary); --moss:var(--brand-tertiary); --rule:var(--brand-rule);
      --sans:Optima, Candara, "Gill Sans", "Gill Sans MT", "Trebuchet MS", "Segoe UI", sans-serif;
      --serif:Charter, "Iowan Old Style", Constantia, "Palatino Linotype", Georgia, serif;
      --mono:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      --gut:clamp(1.25rem,5vw,2.5rem);
    }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:var(--birch); color:var(--ink); font-family:var(--serif);
           font-size:1.0625rem; line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:var(--spruce); }
    :focus-visible { outline:2px solid var(--ochre); outline-offset:3px; }

    header.app { border-bottom:1px solid var(--rule); background:var(--paper); }
    header.app .bar { max-width:60rem; margin-inline:auto; padding:.9rem var(--gut);
      display:flex; align-items:baseline; gap:1.5rem; flex-wrap:wrap; }
    header.app .brand { font-family:var(--sans); font-weight:600; letter-spacing:.07em;
      text-transform:uppercase; text-decoration:none; font-size:1rem; }
    header.app nav { display:flex; gap:1.25rem; margin-left:auto; align-items:baseline; }
    header.app nav a, header.app nav button {
      font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase;
      color:var(--moss); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; }
    header.app nav a:hover, header.app nav button:hover { color:var(--ink); }
    header.app nav a[aria-current="page"] { color:var(--ochre); }

    main { max-width:60rem; margin-inline:auto; padding:2.5rem var(--gut) 4rem; }
    h1 { font-family:var(--sans); font-weight:600; font-size:clamp(1.7rem,4vw,2.2rem);
         line-height:1.15; letter-spacing:-.02em; margin:0 0 .35rem; color:var(--ink); }
    .lede { color:var(--moss); margin:0 0 2rem; }
    h2 { font-family:var(--sans); font-weight:600; font-size:1.2rem; margin:2.5rem 0 .75rem; }

    .card { background:var(--paper); border:1px solid var(--rule); border-radius:2px;
            padding:1.15rem 1.25rem; margin-bottom:1rem; }
    .card p { margin:0 0 .6rem; }
    .card .who { font-family:var(--mono); font-size:.75rem; letter-spacing:.06em;
                 color:var(--moss); text-transform:uppercase; }
    .cap { font-family:var(--mono); font-size:.75rem; color:var(--ochre); }
    .row { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.9rem; }

    button.act, a.act { font-family:var(--sans); font-size:.9rem; font-weight:600;
      color:var(--paper); background:var(--spruce); border:0; border-radius:2px;
      padding:.5rem 1rem; cursor:pointer; text-decoration:none; display:inline-block; }
    button.act:hover, a.act:hover { background:var(--brand-spruce-hover); }
    button.quiet, a.quiet { background:none; color:var(--spruce); border:1px solid var(--rule); }
    button.quiet:hover, a.quiet:hover { background:var(--brand-quiet-hover); }

    form.stack { display:grid; gap:1.1rem; max-width:34rem; }
    label { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em;
            text-transform:uppercase; color:var(--moss); display:block; margin-bottom:.35rem; }
    input[type=text], input[type=password], input[type=number], textarea {
      font:inherit; font-size:1rem; width:100%; padding:.55rem .7rem; color:var(--ink);
      background:#fff; border:1px solid var(--brand-rule-strong); border-radius:2px; }
    textarea { resize:vertical; line-height:1.55; }
    .help { font-size:.85rem; color:var(--moss); margin-top:.3rem; }
    .err { color:var(--brand-error); font-size:.9rem; margin:.3rem 0 0; }
    .empty { color:var(--moss); font-style:italic; }

    table.ledger { width:100%; border-collapse:collapse; background:var(--paper);
                   border:1px solid var(--rule); font-size:.9rem; }
    table.ledger th, table.ledger td { text-align:left; padding:.6rem .8rem;
      border-bottom:1px solid var(--rule); vertical-align:top; }
    table.ledger thead th { font-family:var(--mono); font-size:.68rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--moss); font-weight:400; background:var(--brand-table-head); }
    table.ledger tbody tr:last-child td { border-bottom:0; }
    td.hrs { font-family:var(--mono); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .scroll { overflow-x:auto; }
    .note { font-size:.9rem; color:var(--moss); }
    /* The QR is rendered inline rather than fetched, so it is sized here.
       White plate behind it: scanners want quiet zone and contrast, and the
       birch page background is neither. */
    .qr { background:#fff; border:1px solid var(--rule); border-radius:2px;
          padding:.75rem; width:max-content; max-width:100%; margin:1.5rem 0; }
    .qr svg { display:block; width:min(15rem, 60vw); height:auto; }
    details.card summary { cursor:pointer; font-family:var(--mono); font-size:.75rem;
      letter-spacing:.08em; text-transform:uppercase; color:var(--moss); }
    details.card summary:hover { color:var(--ink); }
    dl.meta { display:grid; grid-template-columns:minmax(7rem,12ch) 1fr; gap:.3rem 1rem;
      font-family:var(--mono); font-size:.9rem; margin:.8rem 0; }
    dl.meta dt { color:var(--moss); } dl.meta dd { margin:0; word-break:break-all; }
  </style>
</head>
<body>
  <header class="app">
    <div class="bar">
      <a class="brand" href="/">Dugnadsand</a>
      {% if user.is_authenticated %}
      <nav>
        <a href="/offerings/" {% if section == "offerings" %}aria-current="page"{% endif %}>On offer</a>
        <a href="/ledger/" {% if section == "ledger" %}aria-current="page"{% endif %}>Ledger</a>
        {% if user.member.is_organizer %}<a href="/members/">Members</a>{% endif %}
        <a href="/password/">Password</a>
        <form method="post" action="/logout/" style="display:inline">{% csrf_token %}
          <button type="submit">Sign out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
