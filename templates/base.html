{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dugnadsand{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="/" class="brand-name">Dugnadsand</a>
            <span class="nav-right">
                <span class="place">Upstate South Carolina</span>
                {% if user.is_authenticated %}
                <a class="signin" href="/offerings/">On offer</a>
                {% else %}
                <a class="signin" href="/login/">Sign in</a>
                {% endif %}
            </span>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Dugnadsand</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
