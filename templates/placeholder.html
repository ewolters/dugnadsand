<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dugnadsand</title>
<link rel="icon" href="data:,">
<style>
  /* Self-contained on purpose. The static manifest is not consulted, so this
     renders whether or not collect-static has run and however the rest of the
     tree changes underneath it. */
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #EBEEE9; color: #2B3733;
    font-family: Georgia, "Times New Roman", Times, serif;
    line-height: 1.6; text-align: center;
    padding: 2rem 1.25rem; box-sizing: border-box;
  }
  .sheet { max-width: 30rem; }
  h1 {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 600; font-size: .8125rem; letter-spacing: .14em;
    text-transform: uppercase; color: #6B7F74;
    margin: 0 0 1.75rem;
  }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }
  .rule { border: 0; border-top: 1px solid #D5DBD4; margin: 2rem 0; }
  .quiet { font-size: .9375rem; color: #6B7F74; }
</style>
</head>
<body>

  <div class="sheet">
    <h1>Dugnadsand</h1>

    <p>This network is closed.</p>

    <p class="quiet">It is not taking requests for help, and requests made here
       are not being read or answered.</p>

    <hr class="rule">

    <p class="quiet">If you need help, please reach a mutual aid group,
       a community organization, or your county services directly.</p>
  </div>

</body>
</html>
