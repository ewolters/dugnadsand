# dugnadsand against the work contract — kjerne_platform/work/spec.toml
#
# The interesting entry in the estate: this site is conformant by declaring
# almost nothing. Every extension it omits is omitted on purpose, and the
# invariants below are why. If a future change adds `owner` to Posting, the
# undeclared check fails before anybody has to notice it in review.

site = "dugnadsand"

# needed_by is the only meaning this site carries, and it is a fact about the
# work rather than a claim about a person — the one extension in the spec that
# contradicts nothing.
extensions = ["scheduling"]

# From policy/manifest.toml. Named here so the contract can prove that no
# extension this site declares contradicts what the site promises.
invariants = [
    "no-balance", "no-gating", "no-routing-by-record", "no-exchange",
    "flat-hours", "no-money-rails", "no-tax-artifact", "no-catalog",
    "no-obligation", "no-aggregate-display", "no-material-valuation",
]

# Verbs this site binds for the shared port. Imported when the port opens.
actions = "site_app.work_actions"

# Everything below is a table. Bare keys must stay ABOVE this line: TOML
# assigns them to whichever table was opened last, so an `extensions` line
# written after [map.party] silently becomes map.party.extensions and the site
# reads as declaring nothing. That is how this file was written the first time,
# and the contract reported it as drift — the right answer, because a misfiled
# declaration and a genuinely undeclared field mean the same thing.

[map.container]
model = "site_app.Project"
id = "id"
tenant = "organization"
name = "name"
description = "description"
state = "open"              # a boolean is a lifecycle; the contract asks for a slot, not a type
created_at = "created_at"
created_by = "started_by"   # who wrote it down. NOT an owner — see the model docstring.

[map.item]
model = "site_app.Posting"
id = "id"
tenant = "organization"
title = "description"       # there is no separate title. The words are the posting.
state = "open"
created_at = "created_at"
created_by = "member"
container = "project"

[map.entry]
model = "site_app.Contribution"
id = "id"
tenant = "organization"
item = "posting"
party = "member"
occurred_at = "recorded_at"

[map.party]
model = "site_app.Member"
id = "id"
tenant = "organization"

[settings.egress]
# What an adapter OUTSIDE this tenant may be handed. Slack is outside. So is a
# webhook and a digest email. Row-level security stops at the process
# boundary, so anything handed over has left the organization for good.
#
# signal-only: that something exists, its state, and a link. Never the free
# text, never a member's name. The link resolves under the reader's own
# session, inside their own tenant, which is where a member's circumstances
# belong. Same rule the notification layer reached the hard way, applied where
# the blast radius is larger.
policy = "signal-only"
link = "/board/"

[settings.tokens]
# Acting without an account: someone with no login gets an email with two
# links. kjerne uses this to ask a contractor to confirm a commitment.
#
# Only `claim` may be reached this way. Not record-entry, which would let a
# forwarded mail write arbitrary hours into the ledger; not close-item, which
# would let it take somebody else's posting off the board. A token lives in an
# inbox and forwards trivially, so the question is never what it should be
# stopped from doing but what is safe enough to put in a mail.
# confirm-receipt is here for the same reason claim is: the person who needs
# to press it is standing somewhere with a phone and no account. It writes one
# timestamp on one manifest and cannot be made to write anything else — the
# payload is fixed when the QR is printed.
verbs = ["claim", "confirm-receipt"]
ttl_hours = 72

# THE SETTING THAT MAKES THIS SITE DIFFERENT.
#
# kjerne records a decline and tells the requester, correctly: somebody planned
# around that person and needs to replan. Here a recorded refusal is the
# obligation this whole system exists to remove. Declining consumes the link
# and does nothing else — no row, nobody told — so saying no and never opening
# the mail leave the system in exactly the same state.
#
# The decline link still exists and is still single-use. If it 404'd instead,
# declining would be distinguishable from ignoring by which button worked.
decline = "silent"
